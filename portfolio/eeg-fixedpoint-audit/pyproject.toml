[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-fixedpoint-audit"
version = "0.1.0"
description = "Reproducible task-level audit of fixed-point EEG spatial projection"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "mne==1.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
